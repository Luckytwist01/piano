<!DOCTYPE html>

    <!-- Tailwind配置：照抄首页 index.html 的配色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#FF7D00',
                        purple: '#9333ea',
                        lightPurple: '#f0e6ff',
                        purpleAccent: '#b894e6',
                        gold: {
                            light: '#FFD700',
                            DEFAULT: '#D4AF37',
                            dark: '#B8860B'
                        },
                        goldPurple: {
                            light: '#E6C5FF',
                            DEFAULT: '#C897E8',
                            dark: '#A267CC',

                        dark: '#1D2129',

                        sans: ['SimHei', '黑体', 'sans-serif'],

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {

<body class="bg-white text-dark font-sans">

<!-- 导航栏：跟首页 index 一模一样（Logo 大小、菜单位置、7 个分类都一样） -->
<!-- 唯一不同是路径：本页在 html/ 文件夹里，首页链接是 ../index.html，内页链接不加 html/ -->
<header class="sticky top-0 bg-white/95 shadow-sm z-50 backdrop-blur-sm py-2">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap items-center">
            <div class="flex items-center mr-4 flex-shrink-0">

                     alt="Lucy Piano Logo"
                     class="h-28 w-auto rounded-full object-cover"
                     onerror="this.src='https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/code_assistant/d7a251f53e3b46c7b84d345e5913a1e2~tplv-a9rns2rl98-image.image?rk3s=8e244e95&rrcfp=e75484ac&x-expires=1754361615&x-signature=51Ct4q9gyy6yaaBSgNDRzjNc800%3D'; this.onerror=null;">
            </div>
            <!-- 桌面菜单：本页在 html/ 文件夹里，所以内页链接不加 html/，首页加 ../ -->
            <!-- 只在 1024px 以上显示，1024px 以下一律用汉堡菜单，就不会出现两行 -->
            <nav class="hidden md:flex items-center space-x-6 flex-1">
                <a href="../index.html" class="nav-link">成人钢琴课</a>
                <a href="free-courses.html" class="nav-link">免费课程</a>
                <a href="about.html" class="nav-link">关于老师</a>
                <a href="contact.html" class="nav-link">联系我们</a>
                <a href="rcm-courses.html" class="nav-link">RCM课程</a>
                <a href="student.html" class="nav-link">学生作品</a>
                <a href="music-share.html" class="nav-link">音乐分享</a>
            </nav>
            <button id="mobile-menu-button" class="md:hidden text-dark text-2xl focus:outline-none ml-auto">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <!-- 移动端菜单：默认藏起来，点汉堡按钮才展开；链接和桌面菜单一样，都是对的 -->
        <div id="mobile-menu" class="md:hidden hidden pb-6">
            <div class="flex flex-col space-y-4">
                <a href="../index.html" class="nav-link">成人钢琴课</a>
                <a href="free-courses.html" class="nav-link">免费课程</a>
                <a href="about.html" class="nav-link">关于老师</a>
                <a href="contact.html" class="nav-link">联系我们</a>
                <a href="rcm-courses.html" class="nav-link">RCM课程</a>

                <a href="music-share.html" class="nav-link">音乐分享</a>
            </div>
        </div>
    </div>
</header>

<!-- 底层水印：照抄首页和内页，同一张图、同一个位置、同一个透明度 -->
<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden;">
    <img src="../images/watermark-big.png" alt="钢琴水印"
         style="position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); max-width: 60%; height: auto; opacity: 0.25;">
</div>

<!-- 最上面：一个小一点的 YouTube 方块，跟首页不一样 -->
<!-- 这里不是首页那个本地视频，是你刚才给的那个 YouTube 链接：https://youtu.be/kSHmEcpr8fY -->
<!-- 方块比下面那几行小：下面一行 2 个，这里只有一个，居中，宽度 max-w-md -->
<!-- 中间的播放按钮是真的链接：一点它，就在新页面打开 YouTube 去看这个视频 -->
<section class="py-8 relative" style="z-index: 10;">
    <div class="container mx-auto px-4">
        <div class="text-center mb-6">
            <h1 class="font-bold text-3xl text-purple leading-tight">学生作品</h1>
        </div>
        <div class="max-w-md mx-auto">
            <a href="https://www.youtube.com/watch?v=kSHmEcpr8fY" target="_blank" rel="noopener" class="youtube-card aspect-video relative bg-gray-100 block overflow-hidden rounded-2xl shadow-sm hover:shadow-md transition-all duration-300" data-video-id="kSHmEcpr8fY" aria-label="在 YouTube 上观看学生演奏视频">
                <img src="https://i.ytimg.com/vi/kSHmEcpr8fY/hqdefault.jpg" alt="" class="w-full h-full object-cover">
                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="play-button w-14 h-14 rounded-full bg-purpleAccent/90 hover:bg-purple flex items-center justify-center shadow-lg transition-all">
                        <i class="fa fa-play text-white text-xl ml-1"></i>
                    </span>
                </span>
            </a>
        </div>
    </div>
</section>

<!-- 学生作品方块：一行 2 个，大方块，手机上一行 1 个 -->
<!-- 用法：每个方块里填一个真实的 YouTube 视频 ID，剩下的方块还是占位，换上真链接就能用 -->
<!-- 视频 ID 就是 YouTube 链接里 v= 后面那一串，例如 https://www.youtube.com/watch?v=AbCdEfGh123 里的 AbCdEfGh123 -->
<!-- 封面不用另外传，换上真实 ID 后，YouTube 会自动用那张图当封面；想用自己的封面，就把 img 的 src 换成你自己的图片 -->
<!-- 方块里什么字都不写 -->
<!-- 中间的播放按钮是真的链接：一点它，就在新页面打开 YouTube 去看那个视频 -->
<section class="py-8 relative" style="z-index: 10;">
    <div class="container mx-auto px-4 max-w-5xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

            <!-- 方块 2 -->
            <a href="https://www.youtube.com/watch?v=YOUTUBE_VIDEO_ID_2" target="_blank" rel="noopener" class="youtube-card aspect-video relative bg-gray-100 block overflow-hidden rounded-2xl shadow-sm hover:shadow-md transition-all duration-300" data-video-id="YOUTUBE_VIDEO_ID_2" aria-label="在 YouTube 上观看学生演奏视频">
                <img src="https://i.ytimg.com/vi/YOUTUBE_VIDEO_ID_2/hqdefault.jpg" alt="" class="w-full h-full object-cover">
                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="play-button w-16 h-16 rounded-full bg-purpleAccent/90 hover:bg-purple flex items-center justify-center shadow-lg transition-all">
                        <i class="fa fa-play text-white text-2xl ml-1"></i>
                    </span>
                </span>
            </a>

            <!-- 方块 3 -->
            <a href="https://www.youtube.com/watch?v=YOUTUBE_VIDEO_ID_3" target="_blank" rel="noopener" class="youtube-card aspect-video relative bg-gray-100 block overflow-hidden rounded-2xl shadow-sm hover:shadow-md transition-all duration-300" data-video-id="YOUTUBE_VIDEO_ID_3" aria-label="在 YouTube 上观看学生演奏视频">
                <img src="https://i.ytimg.com/vi/YOUTUBE_VIDEO_ID_3/hqdefault.jpg" alt="" class="w-full h-full object-cover">
                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="play-button w-16 h-16 rounded-full bg-purpleAccent/90 hover:bg-purple flex items-center justify-center shadow-lg transition-all">
                        <i class="fa fa-play text-white text-2xl ml-1"></i>
                    </span>
                </span>
            </a>

            <!-- 方块 4 -->
            <a href="https://www.youtube.com/watch?v=YOUTUBE_VIDEO_ID_4" target="_blank" rel="noopener" class="youtube-card aspect-video relative bg-gray-100 block overflow-hidden rounded-2xl shadow-sm hover:shadow-md transition-all duration-300" data-video-id="YOUTUBE_VIDEO_ID_4" aria-label="在 YouTube 上观看学生演奏视频">
                <img src="https://i.ytimg.com/vi/YOUTUBE_VIDEO_ID_4/hqdefault.jpg" alt="" class="w-full h-full object-cover">

                    <span class="play-button w-16 h-16 rounded-full bg-purpleAccent/90 hover:bg-purple flex items-center justify-center shadow-lg transition-all">
                        <i class="fa fa-play text-white text-2xl ml-1"></i>
                    </span>
                </span>
            </a>

            <!-- 方块 5 -->
            <a href="https://www.youtube.com/watch?v=YOUTUBE_VIDEO_ID_5" target="_blank" rel="noopener" class="youtube-card aspect-video relative bg-gray-100 block overflow-hidden rounded-2xl shadow-sm hover:shadow-md transition-all duration-300" data-video-id="YOUTUBE_VIDEO_ID_5" aria-label="在 YouTube 上观看学生演奏视频">
                <img src="https://i.ytimg.com/vi/YOUTUBE_VIDEO_ID_5/hqdefault.jpg" alt="" class="w-full h-full object-cover">
                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="play-button w-16 h-16 rounded-full bg-purpleAccent/90 hover:bg-purple flex items-center justify-center shadow-lg transition-all">
                        <i class="fa fa-play text-white text-2xl ml-1"></i>
                    </span>
                </span>
            </a>

            <!-- 方块 6 -->
            <a href="https://www.youtube.com/watch?v=YOUTUBE_VIDEO_ID_6" target="_blank" rel="noopener" class="youtube-card aspect-video relative bg-gray-100 block overflow-hidden rounded-2xl shadow-sm hover:shadow-md transition-all duration-300" data-video-id="YOUTUBE_VIDEO_ID_6" aria-label="在 YouTube 上观看学生演奏视频">

                <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="play-button w-16 h-16 rounded-full bg-purpleAccent/90 hover:bg-purple flex items-center justify-center shadow-lg transition-all">
                        <i class="fa fa-play text-white text-2xl ml-1"></i>
                    </span>
                </span>
            </a>

        </div>

</section>

<!-- 页脚：照抄首页和内页，邮箱、微信、YouTube、版权一模一样 -->
<footer class="bg-white py-10 border-t border-gray-200 relative" style="z-index: 10;">
    <div class="container mx-auto px-4">
        <div class="flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16 mb-8">
            <div class="flex items-center">
                <i class="fa fa-envelope text-purple mr-3 text-xl"></i>
                <span>EMAIL：lucymusic.piano@gmail.com</span>
            </div>
            <div class="flex items-center">
                <i class="fa fa-weixin text-purple mr-3 text-xl"></i>
                <span>WECHAT：Lucy-Piano</span>
            </div>
            <div class="flex items-center">
                <i class="fa fa-youtube-play text-purple mr-3 text-xl"></i>

        <div class="text-center text-gray-600">

<script>
    // 移动端菜单切换：点汉堡展开，再点收起；默认是藏起来的，不会和桌面菜单一起出现
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    mobileMenuButton.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        const icon = mobileMenuButton.querySelector('i');
        if (mobileMenu.classList.contains('hidden')) {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
        } else {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
        }
    });
</script>
</body>
</html>
