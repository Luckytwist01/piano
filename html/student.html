<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生作品 | Lucy Piano Studio</title>
  <style>
    /* 全局统一样式，和主页完全一致 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
    }

    /* 顶部导航栏（和主页同款） */
    header {
      width: 100%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 18px 40px;
      position: sticky;
      top: 0;
      z-index: 99;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 600;
      color: #222;
      text-decoration: none;
    }
    .nav-link {
      margin-left: 30px;
      text-decoration: none;
      color: #555;
      font-size: 16px;
      transition: 0.3s;
    }
    .nav-link:hover {
      color: #222;
    }

    /* 黑白顶部视频横幅 */
    .top-video-banner {
      width: 100%;
      height: 420px;
      overflow: hidden;
      position: relative;
    }
    .top-video-banner video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 核心：黑白滤镜，和主页质感统一 */
      filter: grayscale(100%);
    }
    /* 视频遮罩文字 */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .video-overlay h1 {
      font-size: 42px;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .video-overlay p {
      font-size: 18px;
      opacity: 0.9;
    }

    /* 作品主体区域 */
    .container {
      max-width: 1200px;
      margin: 60px auto;
      padding: 0 20px;
    }
    .work-desc {
      text-align: center;
      color: #666;
      font-size: 16px;
      margin-bottom: 50px;
    }
    .work-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 40px;
    }
    .work-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
    }
    .work-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .video-box {
      width: 100%;
      height: 220px;
    }
    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .work-info {
      padding: 20px;
    }
    .work-name {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #222;
    }
    .work-detail {
      font-size: 14px;
      color: #777;
    }

    /* 底部页脚（和主页同款） */
    footer {
      width: 100%;
      background: #222;
      color: #aaa;
      text-align: center;
      padding: 40px 20px;
      margin-top: 80px;
    }
    footer p {
      font-size: 14px;
    }
  </style>
</head>

<body>
  <!-- 统一头部导航 -->
  <header>
    <div class="nav-container">
      <a href="/" class="logo">Lucy Piano Studio</a>
      <nav>
        <a href="/" class="nav-link">首页</a>
        <a href="student.html" class="nav-link">学生作品</a>
      </nav>
    </div>
  </header>

  <!-- 顶部30秒黑白循环视频横幅 -->
  <section class="top-video-banner">
    <video autoplay muted loop playsinline>
      <!-- 此处替换成你的30秒视频文件名，例如：banner30s.mp4 -->
      <source src="banner30s.mp4" type="video/mp4">
    </video>
    <div class="video-overlay">
      <h1>学生作品展示</h1>
      <p>每一次演奏，都是成长的见证</p>
    </div>
  </section>

  <!-- 学生作品主体内容 -->
  <div class="container">
    <p class="work-desc">记录每一位学员的成长与蜕变，点滴进步，皆为星光</p>
    <div class="work-list">

      <div
